[project]
name = "echolens"
version = "0.1.0"
description = "EchoLens — plateforme d'analyse audio : émotion, événements sonores, transcription, locuteur (INF50101, ENSPY)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Équipe EchoLens — M2 Data Science, ENSPY" }]
dependencies = [
    "flask>=3.0",
    "flask-smorest>=0.44",
    "flask-sock>=0.7",
    "marshmallow>=3.21",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "gunicorn>=22.0",
    "librosa>=0.10",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
# Dépendances des modèles : installées pour l'inférence locale et sur Kaggle.
ml = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "transformers>=4.44",
    "speechbrain>=1.0",
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "noisereduce>=3.0",
    "scikit-learn>=1.4",
]
# Outils d'expérimentation : uniquement pour l'entraînement et l'évaluation.
training = [
    "wandb>=0.17",
    "optuna>=3.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echolens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH"]
# RUF001-003 : les commentaires et docstrings sont en français (apostrophes, guillemets typographiques).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["echolens"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["echolens"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# Les décorateurs flask-smorest ne sont pas typés.
[[tool.mypy.overrides]]
module = "echolens.api.*"
disallow_untyped_decorators = false

# Le cœur de calcul est typé strictement (règle d'architecture, voir CLAUDE.md).
[[tool.mypy.overrides]]
module = "echolens.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests longs (modèles réels), exclus de la CI par défaut",
    "ml: tests nécessitant les dépendances [ml] (torch, transformers)",
    "ffmpeg: tests nécessitant ffmpeg, sautés s'il est absent (la CI l'installe)",
]

[tool.coverage.run]
source = ["echolens"]
