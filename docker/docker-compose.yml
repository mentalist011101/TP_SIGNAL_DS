# Lancement en une commande (ENF-08) : « make docker », ou depuis la racine du dépôt :
#   docker compose -f docker/docker-compose.yml up --build
# Puis http://localhost:5000. Les réglages viennent de ../.env (voir .env.example) :
# ECHOLENS_ACCESS_PASSWORD pour une instance publique, ECHOLENS_PRELOAD_MODELS=true pour une
# démo sans attente à la première analyse.
services:
  echolens:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - path: ../.env
        required: false
    volumes:
      # Historique, audios, voix enregistrées, base SQLite et poids téléchargés depuis Hugging
      # Face, conservés entre deux lancements.
      - echolens-var:/app/var
    restart: unless-stopped

volumes:
  echolens-var:
