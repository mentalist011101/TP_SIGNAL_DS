# Brique 2 — représentations temps-fréquence (décisions R1 à R3 de la spécification).
# Ce fichier est la source unique des paramètres : entraînement (Kaggle) et inférence (Flask).
sample_rate: 16000   # D2 : mono 16 kHz
n_fft: 400           # R1 : fenêtre de 25 ms
hop_length: 160      # R1 : pas de 10 ms
window: hann         # R1 : réduit les fuites spectrales
center: true         # R1 : trame t centrée sur l'échantillon t·hop_length
pad_mode: reflect    # R1 : bords prolongés par réflexion (pas de zéros artificiels)
power: 2.0           # R1 : spectre de puissance |X|²
n_mels: 64           # R2
f_min: 0.0
f_max: 8000.0        # fréquence de Nyquist à 16 kHz
n_mfcc: 40           # R3
db_reference: 1.0    # R2 : dB absolus (0 dB = puissance 1), jamais relatifs au maximum
db_amin: 1.0e-10     # R2 : plancher fixe à 10·log10(1e-10) = −100 dB
delta_width: 9       # R3 : fenêtre de régression des deltas (impair, en trames)

# Affichage du spectrogramme (U6) : présentation seulement, le calcul reste celui de R2.
# Échelle de couleurs FIXE en dB absolus, jamais recalée sur le min/max de chaque extrait :
# - deux audios sont comparables à l'œil (une même couleur = une même énergie) ;
# - un audio faible paraît sombre, au lieu d'être « remonté » artificiellement.
# Mesures de référence avec les paramètres ci-dessus : une sinusoïde pleine amplitude donne
# environ +38 dB à 440 Hz (jusqu'à +41 dB à 4 kHz), un silence numérique −100 dB (plancher R2).
# Tout ce qui est sous display_db_min a la couleur la plus sombre, au-dessus de display_db_max
# la plus claire.
display_db_min: -80.0
display_db_max: 40.0
display_colormap: magma   # palette sombre → claire, lisible aussi en niveaux de gris
# Graduations de l'axe des fréquences de l'image, en Hz. Les 64 bandes sont réparties
# régulièrement en Mel (R2), pas en Hz : 4 kHz est à 76 % de la hauteur, pas au milieu.
# L'API donne la position de chaque graduation (core.features.mel_axis_position).
display_frequency_ticks_hz: [250, 500, 1000, 2000, 4000, 8000]
# Nombre de couleurs de la palette envoyées au front pour dessiner la légende
# (dégradé CSS de display_db_min à display_db_max) ; 6 suffisent pour magma.
display_legend_stops: 6
