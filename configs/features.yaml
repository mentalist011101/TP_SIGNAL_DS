# Brique 2 — représentations temps-fréquence (décisions R1 à R3 de la spécification).
# Ce fichier est la source unique des paramètres : entraînement (Kaggle) et inférence (Flask).
sample_rate: 16000   # D2 : mono 16 kHz
n_fft: 400           # R1 : fenêtre de 25 ms
hop_length: 160      # R1 : pas de 10 ms
window: hann         # R1 : réduit les fuites spectrales
center: true         # R1 : trame t centrée sur l'échantillon t·hop_length
pad_mode: reflect    # R1 : bords prolongés par réflexion (pas de zéros artificiels)
power: 2.0           # R1 : spectre de puissance |X|²
n_mels: 64           # R2
f_min: 0.0
f_max: 8000.0        # fréquence de Nyquist à 16 kHz
n_mfcc: 40           # R3
db_reference: 1.0    # R2 : dB absolus (0 dB = puissance 1), jamais relatifs au maximum
db_amin: 1.0e-10     # R2 : plancher fixe à 10·log10(1e-10) = −100 dB
delta_width: 9       # R3 : fenêtre de régression des deltas (impair, en trames)
