# Registre des modèles (décision S1). Chaque entraînement terminé ajoute ou met à jour une entrée.
# Les poids sont hébergés sur le Hugging Face Hub (I7), en safetensors avec un config.json, et
# téléchargés à la révision figée (revision) par le prédicteur réel (C13).
#
# Champs :
#   id        identifiant, aussi nom du dossier local (models_dir) et du dépôt Hugging Face
#   task      emotion | sound_event | transcription | speaker | voice_cloning
#   family    baseline | A | B | pretrained
#   profiles  quality | realtime (EF-07) : un seul modèle par tâche et par profil
#   weights   hf://<utilisateur>/<dépôt> ; revision : hash de commit du dépôt (40 caractères)
#   metrics   F1 macro et accuracy de test : ESC-50, moyenne des 5 tours (P3) ; émotions,
#             moyenne des 3 graines sur le test de CREMA-D et RAVDESS (P1)
#
# weights et revision sont vides tant que les dépôts Hugging Face ne sont pas publiés : en
# attendant, le prédicteur réel lit les modèles dans un dossier local (models_dir, app.yaml).
models:
  - id: echolens-emotion-whisper-base
    task: emotion
    family: B
    profiles: [quality]
    version: 1.0.0
    weights: ""
    revision: ""
    labels: [neutral, happy, sad, angry, fear, disgust]
    metrics: {f1_macro: 0.7535, accuracy: 0.7495}
    description: Tête sur l'encodeur gelé de Whisper base (somme pondérée des couches, MLP), calibrée (T = 1,109)
  - id: echolens-sound-event-whisper-base
    task: sound_event
    family: B
    profiles: [quality]
    version: 1.0.0
    weights: ""
    revision: ""
    metrics: {f1_macro: 0.8303, accuracy: 0.8347}
    description: Tête sur l'encodeur gelé de Whisper base, entraînée sur les 5 folds d'ESC-50, calibrée (T = 1,461)
  - id: echolens-sound-event-crnn
    task: sound_event
    family: A
    profiles: [realtime]
    version: 1.0.0
    weights: ""
    revision: ""
    metrics: {f1_macro: 0.8266, accuracy: 0.8322}
    description: CRNN (4 blocs conv, BiGRU, attention) sur log-Mel 64 bandes, 5 folds d'ESC-50, calibré (T = 0,786)
